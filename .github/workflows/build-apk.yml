name: Compilar APK de Beyker

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Compilar APK con Gradle
      working-directory: mobile_app/android_project
      run: |
        chmod +x gradlew || true
        gradle assembleDebug || gradle build || true

    - name: Subir APK como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: Beyker-APK
        path: mobile_app/android_project/app/build/outputs/apk/debug/*.apk
